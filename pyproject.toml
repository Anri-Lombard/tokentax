[project]
name = "tokentax"
version = "0.1.0"
description = "How many more tokens (and dollars) the same text costs in your language, across LLM tokenizers."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Anri Lombard", email = "anri.m.lombard@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "huggingface-hub>=1.33.0",
    "tiktoken>=0.14.0",
    "tokenizers>=0.23.2",
]

[project.urls]
Homepage = "https://anri-lombard.github.io/tokentax"
Repository = "https://github.com/Anri-Lombard/tokentax"

[project.scripts]
tokentax = "tokentax.cli:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
data = [
    "pycountry>=26.2.16",
]
